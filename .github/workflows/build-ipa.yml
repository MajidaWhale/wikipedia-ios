name: Build IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: 'Xcode Scheme (Wikipedia, Staging, Experimental)'
        required: true
        default: 'Wikipedia'
        type: choice
        options:
          - Wikipedia
          - Staging
          - Experimental

env:
  XCODE_VERSION: '16.0'

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${XCODE_VERSION}.app
          xcodebuild -version

      - name: Resolve Swift Package Manager dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Wikipedia.xcodeproj \
            -scheme ${{ inputs.scheme }} \
            -clonedSourcePackagesDirPath .build

      - name: Build for Simulator (unsigned)
        run: |
          xcodebuild -project Wikipedia.xcodeproj \
            -scheme ${{ inputs.scheme }} \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -clonedSourcePackagesDirPath .build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Prepare .app bundle
        run: |
          mkdir -p output
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d -path "*/Debug-iphonesimulator/*" | head -1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" output/
            echo "APP_NAME=$(basename "$APP_PATH")" >> $GITHUB_ENV
          else
            find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null | head -10
          fi

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wikipedia-${{ inputs.scheme }}-Simulator
          path: output/*.app
          if-no-files-found: error
